name: Fairfax Crime Data - Daily Update

on:
  # Runs daily at 6 AM UTC (1 AM Eastern, 2 AM EDT)
  schedule:
    - cron: '0 6 * * *'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      max_geocode:
        description: 'Maximum addresses to geocode'
        required: false
        default: '500'

# Prevent overlapping runs — cancel any in-progress run when a new one starts
concurrency:
  group: crime-etl
  cancel-in-progress: true

jobs:
  update-crime-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Full history for proper commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow requests

      - name: Ensure geocode cache directory exists
        run: |
          mkdir -p multi-county-real-estate-research/data/fairfax/crime/raw/geocoded

      - name: Run crime ETL
        run: |
          cd $GITHUB_WORKSPACE
          python multi-county-real-estate-research/scripts/fairfax_crime_etl.py \
            --fetch-weekly \
            --max-geocode ${{ github.event.inputs.max_geocode || '500' }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Read ETL run summary
        id: etl_summary
        run: |
          SUMMARY_FILE="multi-county-real-estate-research/data/fairfax/crime/processed/etl_run_summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            NEW_RECORDS=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE'))['new_records'])")
            TOTAL_RECORDS=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE'))['total_records'])")
            echo "new_records=$NEW_RECORDS" >> $GITHUB_OUTPUT
            echo "total_records=$TOTAL_RECORDS" >> $GITHUB_OUTPUT
          else
            echo "new_records=0" >> $GITHUB_OUTPUT
            echo "total_records=0" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: check_changes
        run: |
          git add -N multi-county-real-estate-research/data/fairfax/crime/
          if git diff --quiet multi-county-real-estate-research/data/fairfax/crime/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add multi-county-real-estate-research/data/fairfax/crime/processed/
          git add multi-county-real-estate-research/data/fairfax/crime/raw/geocoded/

          NEW=${{ steps.etl_summary.outputs.new_records }}
          TOTAL=${{ steps.etl_summary.outputs.total_records }}
          if [ "$NEW" -gt 0 ] 2>/dev/null; then
            git commit -m "Crime data update: $NEW new incidents (total: $TOTAL)"
          else
            git commit -m "Crime data: geocoding/metadata refresh (total unchanged at $TOTAL)"
          fi

          # Pull with rebase to handle any concurrent pushes, then push with retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 2)) seconds..."
            sleep $((attempt * 2))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report status
        if: always()
        run: |
          echo "=== ETL Run Summary ==="
          SUMMARY_FILE="multi-county-real-estate-research/data/fairfax/crime/processed/etl_run_summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE"
          else
            echo "No run summary found"
          fi
          echo ""
          echo "=== Dataset Metadata ==="
          METADATA_FILE="multi-county-real-estate-research/data/fairfax/crime/processed/metadata.json"
          if [ -f "$METADATA_FILE" ]; then
            cat "$METADATA_FILE"
          else
            echo "No metadata file found - check if ETL completed"
          fi
          echo ""
          echo "=== Data Changed: ${{ steps.check_changes.outputs.changed }} ==="
          echo "=== New Records: ${{ steps.etl_summary.outputs.new_records }} ==="
